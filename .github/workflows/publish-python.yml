name: Publish Python Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish. Leave empty when running on a tag ref."
        required: false
        type: string
      target:
        description: "Package set to publish"
        required: true
        default: bootstrap-1
        type: choice
        options:
          - bootstrap-1
          - bootstrap-2
          - all

env:
  PURE_PYTHON_ARTIFACT_PREFIX: python-distributions

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="${INPUT_VERSION}"
          tag_name=""
          if [ -z "$version" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              version="$RELEASE_TAG"
              tag_name="$RELEASE_TAG"
            elif [ "$REF_TYPE" = "tag" ]; then
              version="$REF_NAME"
              tag_name="$REF_NAME"
            else
              printf '%s\n' "Set the version input, publish a GitHub Release, or run this workflow on a tag ref." >&2
              exit 1
            fi
          fi

          version="${version#refs/tags/}"
          version="${version#v}"
          if [[ "$version" == *$'\n'* || "$version" == *$'\r'* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' "Expected semantic version like 0.1.1." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$tag_name" ]; then
            tag_name="${tag_name#refs/tags/}"
            echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          fi

  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve publish target
        id: resolve
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          target="${INPUT_TARGET}"
          if [ -z "$target" ]; then
            if [ -n "$RELEASE_TAG" ] || [ "$REF_TYPE" = "tag" ]; then
              target="all"
            else
              printf '%s\n' "Set the target input, publish a GitHub Release, or run this workflow on a tag ref." >&2
              exit 1
            fi
          fi

          case "$target" in
            bootstrap-1|bootstrap-2|all) ;;
            *)
              printf '%s\n' "Expected target to be one of bootstrap-1, bootstrap-2, all." >&2
              exit 1
              ;;
          esac

          echo "target=$target" >> "$GITHUB_OUTPUT"

  version-check:
    needs:
      - resolve-version
      - resolve-target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Validate release ref
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            release_version="${RELEASE_TAG#refs/tags/}"
            release_version="${release_version#v}"
            if [ "$release_version" != "$VERSION" ]; then
              printf '%s\n' "Release tag does not match release version." >&2
              exit 1
            fi
            exit 0
          fi

          ref_version="${REF_NAME#v}"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$ref_version" != "$VERSION" ]; then
              printf '%s\n' "Tag ref does not match release version." >&2
              exit 1
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "main" ]; then
            echo "::error::Python packages may only be published from a version tag or tagged main commit."
            exit 1
          fi

          tag_commit=""
          for candidate in "$VERSION" "v$VERSION"; do
            if tag_commit="$(git rev-list -n 1 "refs/tags/$candidate" 2>/dev/null)"; then
              break
            fi
            tag_commit=""
          done
          if [ -z "$tag_commit" ]; then
            echo "::error::Create and push a $VERSION tag before publishing from main."
            exit 1
          fi
          if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Release tag $VERSION must point at the checked-out main commit."
            exit 1
          fi

      - name: Validate lockstep package versions
        run: python3 scripts/manage_versions.py check --tag "${{ needs.resolve-version.outputs.version }}"

  build-package:
    needs:
      - resolve-version
      - resolve-target
      - version-check
    strategy:
      matrix:
        include:
          - package_path: tstring-core
            publish_in_bootstrap_1: true
            publish_in_bootstrap_2: false
          - package_path: json-tstring
            publish_in_bootstrap_1: true
            publish_in_bootstrap_2: false
          - package_path: toml-tstring
            publish_in_bootstrap_1: false
            publish_in_bootstrap_2: true
          - package_path: yaml-tstring
            publish_in_bootstrap_1: false
            publish_in_bootstrap_2: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build distribution
        if: ${{ needs.resolve-target.outputs.target == 'all' || (needs.resolve-target.outputs.target == 'bootstrap-1' && matrix.publish_in_bootstrap_1) || (needs.resolve-target.outputs.target == 'bootstrap-2' && matrix.publish_in_bootstrap_2) }}
        run: uv build "${{ matrix.package_path }}" --out-dir dist

      - name: Check distribution metadata
        if: ${{ needs.resolve-target.outputs.target == 'all' || (needs.resolve-target.outputs.target == 'bootstrap-1' && matrix.publish_in_bootstrap_1) || (needs.resolve-target.outputs.target == 'bootstrap-2' && matrix.publish_in_bootstrap_2) }}
        run: uvx twine check dist/*

      - name: Upload distributions
        if: ${{ needs.resolve-target.outputs.target == 'all' || (needs.resolve-target.outputs.target == 'bootstrap-1' && matrix.publish_in_bootstrap_1) || (needs.resolve-target.outputs.target == 'bootstrap-2' && matrix.publish_in_bootstrap_2) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PURE_PYTHON_ARTIFACT_PREFIX }}-${{ matrix.package_path }}
          path: dist/*

  build-bindings-wheels:
    needs:
      - resolve-version
      - resolve-target
      - version-check
    if: ${{ needs.resolve-target.outputs.target == 'all' || needs.resolve-target.outputs.target == 'bootstrap-1' }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: --release --manifest-path rust/python-bindings/Cargo.toml --out dist --compatibility pypi -i python3.14
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
            maturin_args: --release --manifest-path rust/python-bindings/Cargo.toml --out dist --compatibility pypi
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: --release --manifest-path rust/python-bindings/Cargo.toml --out dist --compatibility pypi
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Build bindings wheel (Linux manylinux)
        if: ${{ matrix.os == 'linux' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.maturin_args }}
          manylinux: "2_28"
          sccache: "true"

      - name: Build bindings wheel (host)
        if: ${{ matrix.os != 'linux' }}
        shell: bash
        run: |
          PYTHON_BIN="$(uv run --python 3.14 python - <<'PY'
          import sys
          print(sys.executable)
          PY
          )"
          uvx maturin build --release --manifest-path rust/python-bindings/Cargo.toml --out dist --compatibility pypi -i "$PYTHON_BIN"

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wheels-${{ matrix.os }}
          path: dist/*

  build-bindings-sdist:
    needs:
      - resolve-version
      - resolve-target
      - version-check
    if: ${{ needs.resolve-target.outputs.target == 'all' || needs.resolve-target.outputs.target == 'bootstrap-1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build source distribution
        run: uvx maturin sdist --manifest-path rust/python-bindings/Cargo.toml --out dist

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: bindings-sdist
          path: dist/*

  publish-package:
    strategy:
      matrix:
        include:
          - package_path: tstring-core
            environment_name: pypi-tstring-core
            publish_in_bootstrap_1: true
            publish_in_bootstrap_2: false
          - package_path: json-tstring
            environment_name: pypi-json-tstring
            publish_in_bootstrap_1: true
            publish_in_bootstrap_2: false
          - package_path: toml-tstring
            environment_name: pypi-toml-tstring
            publish_in_bootstrap_1: false
            publish_in_bootstrap_2: true
          - package_path: yaml-tstring
            environment_name: pypi-yaml-tstring
            publish_in_bootstrap_1: false
            publish_in_bootstrap_2: true
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - build-package
    environment:
      name: ${{ matrix.environment_name }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        if: ${{ needs.resolve-target.outputs.target == 'all' || (needs.resolve-target.outputs.target == 'bootstrap-1' && matrix.publish_in_bootstrap_1) || (needs.resolve-target.outputs.target == 'bootstrap-2' && matrix.publish_in_bootstrap_2) }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PURE_PYTHON_ARTIFACT_PREFIX }}-${{ matrix.package_path }}
          path: dist/

      - name: Publish to PyPI
        if: ${{ needs.resolve-target.outputs.target == 'all' || (needs.resolve-target.outputs.target == 'bootstrap-1' && matrix.publish_in_bootstrap_1) || (needs.resolve-target.outputs.target == 'bootstrap-2' && matrix.publish_in_bootstrap_2) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-bindings:
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - build-bindings-wheels
      - build-bindings-sdist
    if: ${{ needs.resolve-target.outputs.target == 'all' || needs.resolve-target.outputs.target == 'bootstrap-1' }}
    environment:
      name: pypi-tstring-bindings
    permissions:
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-wheels-*
          path: dist/
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: bindings-sdist
          path: dist/

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
